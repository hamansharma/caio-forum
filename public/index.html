<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Primary SEO -->
    <title>CAIO Forum — AI &amp; Technology Community</title>

    <meta
      name="description"
      content="CAIO Forum is a community for discussing artificial intelligence, technology, ideas, questions, and projects."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://caio-forum.vercel.app/"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Apple / iOS -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://caio-forum.vercel.app/"
    />

    <meta
      property="og:title"
      content="CAIO Forum — AI &amp; Technology Community"
    />

    <meta
      property="og:description"
      content="A community for discussing artificial intelligence, technology, ideas, questions, and projects."
    />

    <meta
      property="og:site_name"
      content="CAIO Forum"
    />

    <meta
      property="og:image"
      content="https://caio-forum.vercel.app/static/media/CAIO.8aa1e8222956cba28417.png"
    />

    <meta
      property="og:image:alt"
      content="CAIO Forum"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="CAIO Forum — AI &amp; Technology Community"
    />

    <meta
      name="twitter:description"
      content="A community for discussing artificial intelligence, technology, ideas, questions, and projects."
    />

    <meta
      name="twitter:image"
      content="https://caio-forum.vercel.app/static/media/CAIO.8aa1e8222956cba28417.png"
    />

    <meta
      name="twitter:image:alt"
      content="CAIO Forum"
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>

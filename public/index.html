<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Page-specific tags. scripts/prerender.mjs replaces everything between the two
         page-meta markers in each pre-rendered page (title, description, canonical URL,
         social tags, structured data). The markers are meta tags because the build strips
         comments. This default copy is what other URLs fall back to, so it deliberately
         has no canonical URL: the app sets one once it knows the page. -->
    <meta name="page-meta" content="start" />
    <title>CAIO Forum | AI Leadership, Strategy &amp; Technology Community</title>
    <meta name="description" content="Join practical discussions on AI leadership, strategy, technology, and responsible adoption. Explore ideas, projects, and free tools from the CAIO community." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CAIO Forum | AI Leadership, Strategy &amp; Technology Community" />
    <meta property="og:description" content="Join practical discussions on AI leadership, strategy, technology, and responsible adoption. Explore ideas, projects, and free tools from the CAIO community." />
    <meta name="twitter:title" content="CAIO Forum | AI Leadership, Strategy &amp; Technology Community" />
    <meta name="twitter:description" content="Join practical discussions on AI leadership, strategy, technology, and responsible adoption. Explore ideas, projects, and free tools from the CAIO community." />
    <meta name="page-meta" content="end" />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:site_name" content="CAIO Forum" />
    <meta property="og:image" content="https://caioleadership.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CAIO Forum — Chief AI Officer community" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://caioleadership.com/og-image.png" />
    <meta name="twitter:image:alt" content="CAIO Forum — Chief AI Officer community" />

    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts: requested from the HTML so they start downloading early, but without
         holding up the first paint (text shows in a fallback font, then swaps). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" /></noscript>

    <!-- Pre-rendered page text (see #page-content below), shown until the app loads. -->
    <style>
      #page-content { max-width: 760px; margin: 0 auto; padding: 88px 16px 48px; color: var(--text-secondary, #9fa8c7); font-size: 15px; line-height: 1.7; }
      #page-content h1 { color: var(--text-primary, #e8eaf6); font-size: 28px; line-height: 1.3; margin-bottom: 12px; }
      #page-content h2, #page-content h3 { color: var(--text-primary, #e8eaf6); font-size: 18px; margin: 24px 0 8px; }
      #page-content p, #page-content ul, #page-content dl { margin-bottom: 12px; }
      #page-content ul { padding-left: 20px; }
      #page-content a { color: var(--accent-text, #9180f9); }
      #page-content dt { color: var(--text-primary, #e8eaf6); font-weight: 600; }
      #page-content dd { margin: 0 0 10px; }
    </style>

    <!-- Google Analytics 4 with Consent Mode. Analytics cookies stay off until the
         visitor accepts in the cookie banner (src/components/CookieConsent.jsx);
         until then GA sends only cookieless pings. Ad features are always off.
         The GA script itself loads after the page, so it doesn't compete with the
         page's own downloads; events queued before then are sent once it loads. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var analyticsConsent = null;
      try { analyticsConsent = window.localStorage.getItem('caio-analytics-consent'); } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: analyticsConsent === 'granted' ? 'granted' : 'denied'
      });
      gtag('js', new Date());
      // Page views are sent by the app once each page has its real title (usePageMeta).
      gtag('config', 'G-166FH9J9BC', { send_page_view: false });
      window.addEventListener('load', function () {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-166FH9J9BC';
        document.head.appendChild(script);
      });
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://caioleadership.com/#website",
            "name": "CAIO Forum",
            "url": "https://caioleadership.com/",
            "description": "A community for AI leaders: practical discussions on AI strategy, governance, and adoption, plus free decision-support tools.",
            "publisher": { "@id": "https://caioleadership.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://caioleadership.com/#organization",
            "name": "CAIO Forum",
            "url": "https://caioleadership.com/",
            "logo": "https://caioleadership.com/logo-512.png"
          }
        ]
      }
    </script>
  </head>

  <body>
    <!-- Shown only without JavaScript. -->
    <noscript>
      <nav aria-label="Site">
        <a href="https://caioleadership.com/">CAIO Forum home</a> ·
        <a href="https://caioleadership.com/category/strategy">Strategy</a> ·
        <a href="https://caioleadership.com/category/concepts">Concepts</a> ·
        <a href="https://caioleadership.com/category/discussion">Discussion</a> ·
        <a href="https://caioleadership.com/category/ethics">Ethics</a> ·
        <a href="https://caioleadership.com/playground">AI Playground</a> ·
        <a href="https://caioleadership.com/playground/data-atlas">Data Atlas</a> ·
        <a href="https://caioleadership.com/certifications">Certifications</a>
      </nav>
      <p>CAIO Forum works best with JavaScript enabled.</p>
    </noscript>

    <!-- Pre-rendered pages put their own text in #page-content (scripts/lib/pageHtml.js),
         so it shows straight away; the app replaces it when it starts. Every app
         route is served one of these files, so the text is removed at once when it
         belongs to a different URL (e.g. the home page's text on /profile), and
         so are the canonical URL and og:url, which belong to that other page. -->
    <div id="root"><div id="page-content"></div></div>
    <script>!function(){var c=document.getElementById('page-content');if(!c)return;var p=location.pathname.replace(/\/+$/,'')||'/';if(c.getAttribute('data-path')===p)return;c.parentNode.removeChild(c);document.querySelectorAll('link[rel=canonical],meta[property="og:url"]').forEach(function(e){e.parentNode.removeChild(e)})}()</script>
  </body>
</html>

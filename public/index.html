<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Google Analytics 4 with Consent Mode. Analytics cookies stay off until the
         visitor accepts in the cookie banner (src/components/CookieConsent.jsx);
         until then GA sends only cookieless pings. Ad features are always off. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var analyticsConsent = null;
      try { analyticsConsent = window.localStorage.getItem('caio-analytics-consent'); } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: analyticsConsent === 'granted' ? 'granted' : 'denied'
      });
      gtag('js', new Date());
      // Page views are sent by the app once each page has its real title (usePageMeta).
      gtag('config', 'G-166FH9J9BC', { send_page_view: false });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-166FH9J9BC"></script>

    <!-- Fonts: requested from the HTML so they start downloading before the app's CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    />

    <!-- Primary SEO -->
    <title>CAIO Forum — AI &amp; Technology Community</title>

    <meta
      name="description"
      content="CAIO Forum is an open community for practical AI, technology, and free open-source tools that help teams make better decisions."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://caioleadership.com/"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Apple / iOS -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://caioleadership.com/"
    />

    <meta
      property="og:title"
      content="CAIO Forum — AI &amp; Technology Community"
    />

    <meta
      property="og:description"
      content="A community for discussing artificial intelligence, technology, ideas, questions, and projects."
    />

    <meta
      property="og:site_name"
      content="CAIO Forum"
    />

    <meta
      property="og:image"
      content="https://caioleadership.com/static/media/CAIO.8aa1e8222956cba28417.png"
    />

    <meta
      property="og:image:alt"
      content="CAIO Forum"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="CAIO Forum — AI &amp; Technology Community"
    />

    <meta
      name="twitter:description"
      content="A community for discussing artificial intelligence, technology, ideas, questions, and projects."
    />

    <meta
      name="twitter:image"
      content="https://caioleadership.com/static/media/CAIO.8aa1e8222956cba28417.png"
    />

    <meta
      name="twitter:image:alt"
      content="CAIO Forum"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CAIO Forum",
        "url": "https://caioleadership.com/",
        "description": "An open community for practical AI, technology, and decision-support tools."
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
